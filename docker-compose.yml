services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: web-agent-framework-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
